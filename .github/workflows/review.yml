# Records a pre-merge review verdict (docs/context.md) as the `pre-merge review` commit status on the exact head
# it names. A collaborator's PR comment whose first line is `PASS <head commit>` or `FAIL <head commit>` sets
# success or failure on that head, if it is still the PR's head. It writes nothing else.
name: pre-merge review

on:
  issue_comment:
    types: [created]

permissions:
  statuses: write
  pull-requests: read

jobs:
  record:
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, 'PASS ') || startsWith(github.event.comment.body, 'FAIL '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          URL: ${{ github.event.comment.html_url }}
        run: |
          read -r verdict commit rest <<< "$(printf '%s\n' "$BODY" | head -n 1 | tr -d '\r')"
          [[ -z "$rest" && "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "first line is not '<PASS|FAIL> <full head commit>'"; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          [ "$commit" = "$head" ] || { echo "the verdict names $commit, but the PR head is $head"; exit 1; }
          state=success; [ "$verdict" = PASS ] || state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" -f context="pre-merge review" \
            -f description="$verdict" -f target_url="$URL"
